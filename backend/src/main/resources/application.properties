spring.application.name=backend
server.address=${ADDRESS:0.0.0.0}
server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.datasource.url=${DB_CONNECTION_STRING:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:1.0}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:16}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true